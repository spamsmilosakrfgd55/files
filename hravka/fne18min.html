<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Access Denied</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff8c00, #ffa733);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
  }

  .box {
    background: rgba(255, 255, 255, 0.1);
    padding: 50px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
  }

  h1 {
    font-size: 32px;
    margin-bottom: 20px;
  }

  p {
    font-size: 18px;
  }
</style>
</head>
<body>

<div class="box">
  <h1>Access Denied</h1>
  <p>You must be 18+ to play this game.</p>
</div>

</body>
</html>
